---
- name: Configurar Servidor Web
  hosts: all
  become: yes
  gather_facts: no # Desactivamos temporalmente para evitar fallos si SSH aún arranca
  
  tasks:
    - name: Esperar a que el puerto SSH esté 100% disponible
      wait_for_connection:
        delay: 10
        timeout: 60

    - name: Recopilar datos del sistema (Facts)
      setup:

    - name: Instalar servidor web Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Subir el archivo index.html al servidor
      copy:
        src: ./index.html
        dest: /var/www/html/index.html
        mode: '0644'